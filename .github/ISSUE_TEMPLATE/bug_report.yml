name: Detection issue
description: Report a reproducible detection or training problem
title: "[Detection]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the script, model, input type, and expected behavior.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python, Ultralytics, and hardware versions
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Remove private paths, images, and credentials.
