name: CI

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/check_docs.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q codes models
      - run: python -m pip install pytest
      - run: python -m pytest -q
